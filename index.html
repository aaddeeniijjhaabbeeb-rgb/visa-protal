<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visa Application Status</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    color: #172033;
}

.header {
    background: #12345b;
    color: white;
    padding: 18px 7%;
    font-weight: bold;
}

.container {
    max-width: 850px;
    margin: 50px auto;
    padding: 20px;
}

.card {
    background: white;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 30px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.07);
}

.small-title {
    color: #687386;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
}

h1 {
    font-size: 28px;
    margin: 10px 0 20px 0;
}

.status {
    margin: 25px 0;
    padding: 18px;
    background: #eaf7ee;
    border: 1px solid #b8ddc3;
    border-radius: 8px;
    color: #176a2b;
    font-weight: bold;
    font-size: 18px;
}

.details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: #ddd;
    margin-top: 20px;
}

.detail {
    background: white;
    padding: 18px;
}

.label {
    color: #758093;
    font-size: 11px;
    text-transform: uppercase;
}

.value {
    margin-top: 6px;
    font-weight: bold;
}

.button {
    display: inline-block;
    margin-top: 25px;
    padding: 13px 20px;
    background: #12345b;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
}

@media (max-width: 600px) {
    .details {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 24px;
    }

    .container {
        margin: 30px auto;
    }
}
</style>
</head>

<body>

<header class="header">
    Travel Application Portal
</header>

<div class="container">

<div class="card">

    <div class="small-title">
        APPLICATION STATUS
    </div>

    <h1>
        United States Visa Application
    </h1>

    <div class="status">
        ✓ APPROVED
    </div>

    <div class="details">

        <div class="detail">
            <div class="label">
                Application Country
            </div>
            <div class="value">
                Poland
            </div>
        </div>

        <div class="detail">
            <div class="label">
                Destination
            </div>
            <div class="value">
                United States
            </div>
        </div>

        <div class="detail">
            <div class="label">
                Application Type
            </div>
            <div class="value">
                US Visa
            </div>
        </div>

        <div class="detail">
            <div class="label">
                Status
            </div>
            <div class="value">
                Approved
            </div>
        </div>

        <div class="detail">
            <div class="label">
                Travel Date
            </div>
            <div class="value">
                23 October 2026
            </div>
        </div>

        <div class="detail">
            <div class="label">
                 Record ID
            </div>
            <div class="value">
                USA-2026-1023
            </div>
        </div>

    </div>

    <a class="button" href="details.html">
        View Application Details
    </a>

</div>

</div>

</body>
</html>
